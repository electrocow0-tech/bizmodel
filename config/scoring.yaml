# Единственный критерий рейтинга: вероятность за 3 месяца запустить тест,
# проверить спрос и получить первую оплату. Поэтому 70 из 100 - скорость и доступ.
# Уровень 1-5 по каждой шкале выставляет модель, итог считает код:
# балл = сумма по шкалам вес * (уровень - 1) / 4.

rubrics:
  - id: time_to_test
    title: Скорость до работающего теста
    weight: 25
    levels:
      1: Нужны месяцы разработки, свои данные или партнёры, которых нет
      3: Тест собирается за 6-8 недель, есть одна внешняя зависимость
      5: Тест собирается за 2-4 недели из готовых сервисов

  - id: customer_access
    title: Доступ к первым клиентам
    weight: 25
    levels:
      1: Покупатель - крупная компания или ведомство, цикл сделки от полугода
      3: Покупатель - средний бизнес, решение принимают несколько человек за 1-2 месяца
      5: Покупателя можно достать рекламой или холодным письмом за недели, решает один человек

  - id: time_to_payment
    title: Скорость первой оплаты
    weight: 20
    levels:
      1: Оплата только после пилота, закупочной процедуры и договора
      3: Оплата по счёту после короткого пробного периода
      5: Оплата картой при регистрации, цена в пределах личного лимита покупателя

  - id: demand_proof
    title: Доказанность спроса
    weight: 10
    levels:
      1: Есть только аналог по модели, спрос в этом сегменте не подтверждён
      3: Есть компания с подтверждённым размером и публичными ценами
      5: Несколько компаний с публичными ценами и подтверждённым ростом

  - id: barriers
    title: Барьеры и зависимости
    weight: 10
    levels:
      1: Всё держится на одной платформе, регуляторе или холодном старте двух сторон рынка
      3: Есть зависимость от чужих данных или интеграций, но ей есть замена
      5: Внешних зависимостей нет

  - id: objections
    title: Возражения критика, устоявшие после проверки
    weight: 10
    computed: true
    levels:
      1: Все сильные возражения подтверждены источниками
      3: Часть возражений подтверждена или осталась без проверки
      5: Ни одно сильное возражение не подтвердилось

# Сколько весит возражение в шкале objections в зависимости от вердикта проверяющего.
objection_weight:
  supported: 1.0
  no_source: 0.5
  source_unavailable: 0.5
  not_supported: 0.0
  contradicts: 0.0

# Уверенность в паспорте выводится из правил, а не из самооценки модели.
confidence:
  high: Дословная цитата найдена на сохранённой странице и голоса единогласны, либо источник подтверждён проверяющим
  medium: Дословная цитата найдена, решение принято кворумом или арбитром; либо расчёт по подтверждённым числам
  low: Цитаты нет, источник недоступен или голоса разошлись

# Доверие к карточке: доля фактов (фильтр и возражения), подтверждённых цитатой из источника.
trust:
  high: 0.6
  medium: 0.3
